name: Video Pipeline

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'মোড'
        required: true
        default: 'draft'
        type: choice
        options:
          - script_only
          - voice_test
          - draft
          - full
      minutes:
        description: 'দৈর্ঘ্য (মিনিট), যেমন 1.5 = দেড় মিনিট'
        required: true
        default: '1.5'
      aspect:
        description: 'সাইজ'
        required: true
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'
          - '1:1'
          - '4:5'
      kind:
        description: 'ভিডিওর ধরন (A=টিউটোরিয়াল, B=কার্টুন ব্যাখ্যা, C=ম্যাপ ও ডেটা)'
        required: true
        default: 'B'
        type: choice
        options:
          - A
          - B
          - C
      theme:
        description: 'রঙ/পরিবেশ (warm, cool, dark, nature, bright)'
        required: true
        default: 'warm'
      music:
        description: 'গান'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - off
          - upbeat
          - calm
      topic:
        description: 'টপিক (script খালি হলে লাগবে)'
        required: false
        default: ''
      project:
        description: 'প্রিসেট (projects.json-এর নাম, ঐচ্ছিক)'
        required: false
        default: ''
      brief:
        description: 'অতিরিক্ত বিস্তারিত (ঐচ্ছিক)'
        required: false
        default: ''
      script:
        description: 'পূর্ণ স্ক্রিপ্ট (দিলে একটি শব্দও বদলাবে না)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IN_MODE: ${{ inputs.mode }}
          IN_MINUTES: ${{ inputs.minutes }}
          IN_ASPECT: ${{ inputs.aspect }}
          IN_KIND: ${{ inputs.kind }}
          IN_THEME: ${{ inputs.theme }}
          IN_MUSIC: ${{ inputs.music }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_PROJECT: ${{ inputs.project }}
          IN_BRIEF: ${{ inputs.brief }}
          IN_SCRIPT: ${{ inputs.script }}
        run: node pipeline.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: |
            out/
            data/log.txt
          if-no-files-found: warn
          retention-days: 7
