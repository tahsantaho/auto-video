name: Auto Video
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'টপিক (খালি রাখলে AI নিজে বেছে নেবে)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: video
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2 libasound2t64 || sudo apt-get install -y libasound2
      - name: Write files
        run: |
          mkdir -p src data out
          cat > package.json <<'EOF'
          {
            "name": "auto-video",
            "private": true,
            "type": "module",
            "dependencies": {
              "remotion": "^4.0.0",
              "@remotion/cli": "^4.0.0",
              "@remotion/renderer": "^4.0.0",
              "@remotion/bundler": "^4.0.0",
              "@remotion/google-fonts": "^4.0.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            }
          }
          EOF
          cat > config.json <<'EOF'
          {
            "niche": "মজার ও আশ্চর্য তথ্য",
            "language": "Bengali",
            "scenes": 7,
            "width": 1080,
            "height": 1920,
            "fps": 30,
            "crf": 28,
            "concurrency": 2,
            "gemini_model": "gemini-2.5-flash",
            "cartesia": { "model": "sonic-3", "version": "2025-04-16", "language": "bn", "sample_rate": 24000 },
            "prompt": "You are a viral short-video scriptwriter. Niche: {{niche}}. Language of all spoken text: {{language}} (natural spoken style, short sentences, no filler, no robotic phrasing). Topic: {{topic}}. Do NOT repeat these past topics: {{history}}. Write exactly {{scenes}} scenes. Scene 1 must be a strong hook. The last scene is a short call to action. Each scene text is 1-2 short sentences, max 25 words. Return ONLY valid JSON in this shape: {\"topic\":\"\",\"title\":\"\",\"description\":\"\",\"hashtags\":[\"\"],\"scenes\":[{\"text\":\"\",\"image_prompt\":\"English, vivid cinematic vertical image description, no text in image\",\"keywords\":[\"1-2 important words copied exactly from text\"],\"highlight\":false}]}"
          }
          EOF
          cat > pipeline.mjs <<'EOF'
          import fs from 'fs';
          import { execSync } from 'child_process';

          const E = process.env;
          const cfg = JSON.parse(fs.readFileSync('config.json', 'utf8'));
          for (const d of ['data', 'out', 'public/audio', 'public/img']) fs.mkdirSync(d, { recursive: true });

          const log = (m) => {
            const l = `[${new Date().toISOString()}] ${m}`;
            console.log(l);
            fs.appendFileSync('data/log.txt', l + '\n');
          };
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function retry(fn, n = 3) {
            for (let a = 1; ; a++) {
              try {
                return await fn();
              } catch (e) {
                log(`ভুল (${a}/${n}): ${e.message}`);
                if (a >= n) throw e;
                await sleep(4000 * a);
              }
            }
          }

          async function makeScript(hist) {
            const prompt = cfg.prompt
              .replaceAll('{{niche}}', cfg.niche)
              .replaceAll('{{language}}', cfg.language)
              .replaceAll('{{scenes}}', String(cfg.scenes))
              .replaceAll('{{topic}}', E.TOPIC || '(choose a fresh engaging topic yourself)')
              .replaceAll('{{history}}', hist.slice(-30).join(' | ') || 'none');
            const r = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${cfg.gemini_model}:generateContent`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': E.GEMINI_API_KEY },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { responseMimeType: 'application/json', temperature: 1 },
                }),
              }
            );
            if (!r.ok) throw new Error('Gemini ' + r.status + ' ' + (await r.text()).slice(0, 300));
            const j = await r.json();
            const t = j.candidates[0].content.parts[0].text.replace(/^[^{]*/, '').replace(/[^}]*$/, '');
            const s = JSON.parse(t);
            if (!Array.isArray(s.scenes) || s.scenes.length < 2) throw new Error('স্ক্রিপ্ট ঠিক নয়');
            return s;
          }

          async function tts(text) {
            const r = await fetch('https://api.cartesia.ai/tts/bytes', {
              method: 'POST',
              headers: {
                'X-API-Key': E.CARTESIA_API_KEY,
                'Cartesia-Version': cfg.cartesia.version,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model_id: cfg.cartesia.model,
                transcript: text,
                voice: { mode: 'id', id: E.CARTESIA_VOICE_ID },
                language: cfg.cartesia.language,
                output_format: { container: 'raw', encoding: 'pcm_s16le', sample_rate: cfg.cartesia.sample_rate },
              }),
            });
            if (!r.ok) throw new Error('Cartesia ' + r.status + ' ' + (await r.text()).slice(0, 300));
            return Buffer.from(await r.arrayBuffer());
          }

          function wav(pcm, sr) {
            const h = Buffer.alloc(44);
            h.write('RIFF', 0);
            h.writeUInt32LE(36 + pcm.length, 4);
            h.write('WAVE', 8);
            h.write('fmt ', 12);
            h.writeUInt32LE(16, 16);
            h.writeUInt16LE(1, 20);
            h.writeUInt16LE(1, 22);
            h.writeUInt32LE(sr, 24);
            h.writeUInt32LE(sr * 2, 28);
            h.writeUInt16LE(2, 32);
            h.writeUInt16LE(16, 34);
            h.write('data', 36);
            h.writeUInt32LE(pcm.length, 40);
            return Buffer.concat([h, pcm]);
          }

          async function getImage(prompt, i) {
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=720&height=1280&nologo=true&seed=${(Date.now() % 100000) + i}`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('Image ' + r.status);
            const b = Buffer.from(await r.arrayBuffer());
            if (b.length < 5000) throw new Error('ছবি ছোট');
            fs.writeFileSync(`public/img/s${i}.jpg`, b);
            return `img/s${i}.jpg`;
          }

          async function main() {
            const hist = fs.existsSync('data/history.json') ? JSON.parse(fs.readFileSync('data/history.json', 'utf8')) : [];

            log('স্ক্রিপ্ট তৈরি হচ্ছে');
            const sc = await retry(() => makeScript(hist));
            log('টপিক: ' + sc.topic);

            const sr = cfg.cartesia.sample_rate;
            const fps = cfg.fps;
            let cursor = 0;
            const scenes = [];
            for (let i = 0; i < sc.scenes.length; i++) {
              const s = sc.scenes[i];
              log(`দৃশ্য ${i + 1}/${sc.scenes.length}: ভয়েস ও ছবি`);
              const pcm = await retry(() => tts(s.text));
              fs.writeFileSync(`public/audio/s${i}.wav`, wav(pcm, sr));
              const sec = pcm.length / (sr * 2);
              const frames = Math.ceil(sec * fps) + Math.round(fps * 0.35);
              let img = null;
              try {
                img = await retry(() => getImage(s.image_prompt || sc.topic, i), 2);
              } catch (e) {
                log('ছবি ছাড়াই চলছে (গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড)');
              }
              scenes.push({
                text: s.text,
                keywords: (s.keywords || []).filter(Boolean),
                highlight: !!s.highlight,
                audio: `audio/s${i}.wav`,
                img,
                start: cursor,
                frames,
              });
              cursor += frames;
            }

            fs.writeFileSync(
              'out/props.json',
              JSON.stringify({ scenes, totalFrames: cursor, width: cfg.width, height: cfg.height })
            );

            log(`রেন্ডার শুরু (${cursor} ফ্রেম)`);
            const render = (c) =>
              execSync(
                `npx remotion render src/index.jsx Main out/video.mp4 --props=out/props.json --concurrency=${c} --crf=${cfg.crf} --log=error`,
                { stdio: 'inherit' }
              );
            try {
              render(cfg.concurrency);
            } catch (e) {
              log('রেন্ডার ফেল, কম মেমোরিতে আবার চেষ্টা');
              render(1);
            }

            fs.writeFileSync(
              'out/info.json',
              JSON.stringify({ title: sc.title, description: sc.description, hashtags: sc.hashtags }, null, 2)
            );
            log('ভিডিও তৈরি শেষ: ' + sc.title);

            hist.push(sc.topic);
            fs.writeFileSync('data/history.json', JSON.stringify(hist.slice(-100), null, 2));
          }

          main().catch((e) => {
            log('চূড়ান্ত ব্যর্থ: ' + e.message);
            process.exit(1);
          });
          EOF
          cat > src/index.jsx <<'EOF'
          import React from 'react';
          import {
            registerRoot, Composition, AbsoluteFill, Sequence, Audio, Img, staticFile,
            useCurrentFrame, useVideoConfig, interpolate, spring,
          } from 'remotion';
          import { loadFont } from '@remotion/google-fonts/NotoSansBengali';

          const { fontFamily } = loadFont('normal', { weights: ['700'], subsets: ['bengali', 'latin'] });
          const BG = ['#1b1f3b', '#3b1f2b', '#1f3b2e', '#2b2b52'];

          const Scene = ({ s, i }) => {
            const f = useCurrentFrame();
            const { width, fps } = useVideoConfig();
            const p = f / s.frames;
            const scale = i % 2 === 0 ? 1 + 0.12 * p : 1.12 - 0.12 * p;
            const dir = i % 3 === 0 ? -1 : 1;
            const panX = interpolate(p, [0, 1], [-30 * dir, 30 * dir]);
            const fade = interpolate(f, [0, 8], [0, 1], { extrapolateRight: 'clamp' });
            const words = s.text.split(/\s+/);
            const n = words.length;
            const kws = s.keywords || [];
            const bounce = Math.sin(f / 5) * 14;

            return (
              <AbsoluteFill style={{ opacity: fade, overflow: 'hidden' }}>
                {s.img ? (
                  <Img
                    src={staticFile(s.img)}
                    style={{ width: '100%', height: '100%', objectFit: 'cover', transform: `scale(${scale}) translateX(${panX}px)` }}
                  />
                ) : (
                  <AbsoluteFill style={{ background: `linear-gradient(160deg, ${BG[i % 4]}, #000)`, transform: `scale(${scale})` }} />
                )}
                <AbsoluteFill style={{ background: 'linear-gradient(transparent 35%, rgba(0,0,0,.8))' }} />
                <AbsoluteFill
                  style={{
                    background: `radial-gradient(circle at ${50 + 20 * Math.sin(f / 40)}% ${40 + 10 * Math.cos(f / 50)}%, rgba(255,255,255,.10), rgba(0,0,0,.5) 80%)`,
                  }}
                />
                {s.highlight && (
                  <div style={{ position: 'absolute', left: '50%', bottom: '36%', transform: `translate(-50%, ${bounce}px)` }}>
                    <svg width={width * 0.14} height={width * 0.14} viewBox="0 0 100 100">
                      <path d="M50 92 L12 46 H38 V8 H62 V46 H88 Z" fill="#FFE23A" />
                    </svg>
                  </div>
                )}
                <div
                  style={{
                    position: 'absolute', left: '6%', right: '6%', bottom: '12%',
                    display: 'flex', flexWrap: 'wrap', justifyContent: 'center',
                    gap: `0 ${width * 0.02}px`, fontFamily, fontWeight: 700,
                    fontSize: width * 0.07, lineHeight: 1.4, color: '#fff',
                    textShadow: '0 4px 18px rgba(0,0,0,.9)',
                  }}
                >
                  {words.map((w, k) => {
                    const at = Math.round((k / n) * s.frames * 0.85);
                    const sp = spring({ frame: f - at, fps, config: { damping: 12, stiffness: 180 } });
                    const key = kws.some((x) => x && w.includes(x));
                    return (
                      <span
                        key={k}
                        style={{
                          opacity: Math.min(1, sp * 3),
                          transform: `translateY(${(1 - sp) * 40}px) scale(${0.6 + 0.4 * sp})`,
                          color: key ? '#FFE23A' : '#fff',
                          background: key ? 'rgba(0,0,0,.4)' : 'none',
                          borderRadius: 12, padding: '0 .15em',
                        }}
                      >
                        {w}
                      </span>
                    );
                  })}
                </div>
                <Audio src={staticFile(s.audio)} />
              </AbsoluteFill>
            );
          };

          const Main = ({ scenes }) => (
            <AbsoluteFill style={{ background: '#000' }}>
              {scenes.map((s, i) => (
                <Sequence key={i} from={s.start} durationInFrames={s.frames}>
                  <Scene s={s} i={i} />
                </Sequence>
              ))}
            </AbsoluteFill>
          );

          const Root = () => (
            <Composition
              id="Main"
              component={Main}
              durationInFrames={300}
              fps={30}
              width={1080}
              height={1920}
              defaultProps={{ scenes: [], totalFrames: 300, width: 1080, height: 1920 }}
              calculateMetadata={({ props }) => ({
                durationInFrames: Math.max(1, props.totalFrames),
                width: props.width,
                height: props.height,
              })}
            />
          );

          registerRoot(Root);
          EOF
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Make video
        env:
          GEMINI_API_KEY: AQ.Ab8RN6L3ur7EqwGO0S7g5jU-u4u_iCJBS80iNIQTSTFckPnMQQ
          CARTESIA_API_KEY: sk_car_m5jw9NPS6U9vDokjDaU8mr
          CARTESIA_VOICE_ID: a17970ca-acfb-4189-abbd-55b678db4961
          TOPIC: ${{ github.event.inputs.topic }}
        run: node pipeline.mjs
      - name: Save log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "log update" || true
          git pull --rebase || true
          git push || true
      - name: Video download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/info.json
            data/
          retention-days: 30
          if-no-files-found: ignore
