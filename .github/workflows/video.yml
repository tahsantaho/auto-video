name: Ultimate Autonomous Video Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select Execution Mode'
        required: true
        default: 'Full'
        type: choice
        options:
          - Full
          - Draft
          - Voice_test
          - Script_only
      aspect:
        description: 'Video Aspect Ratio'
        required: true
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'
          - '1:1'
      topic:
        description: 'Enter Video Topic or Subject'
        required: true
        default: 'Bengali Folk & Moral Story'
      custom_script:
        description: 'Optional Custom Script (Leave blank if AI should write)'
        required: false
        default: ''

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Workspace & Runtime Config
        run: |
          mkdir -p src assets output
          
          # ফ্রন্টএন্ড বা ইনপুট থেকে পাওয়া ডেটা দিয়ে ডাইনামিক কনফিগার তৈরি
          cat << 'EOF' > config.json
          {
            "mode": "${{ github.event.inputs.mode }}",
            "aspect": "${{ github.event.inputs.aspect }}",
            "topic": "${{ github.event.inputs.topic }}",
            "customScript": "${{ github.event.inputs.custom_script }}"
          }
          EOF

          # পাইপলাইন হ্যান্ডলার ও এক্সিকিউটর স্ক্রিপ্ট
          cat << 'EOF' > pipeline.mjs
          import fs from 'fs';
          
          try {
            const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            console.log("=== VIDEO PIPELINE INITIALIZED ===");
            console.log(`Execution Mode : ${config.mode}`);
            console.log(`Aspect Ratio   : ${config.aspect}`);
            console.log(`Topic          : ${config.topic}`);
            if(config.customScript) {
              console.log("Custom Script  : Provided by user");
            }

            // API Validation
            const missingKeys = [];
            if (!process.env.GEMINI_API_KEY) missingKeys.push('GEMINI_API_KEY');
            if (!process.env.CARTESIA_API_KEY) missingKeys.push('CARTESIA_API_KEY');
            if (!process.env.PEXELS_API_KEY) missingKeys.push('PEXELS_API_KEY');

            if (missingKeys.length > 0) {
              console.error(`ERROR: Missing required API keys in Secrets: ${missingKeys.join(', ')}`);
              process.exit(1);
            }

            console.log("All API keys verified successfully. Executing generation workflow...");
          } catch (err) {
            console.error("Pipeline initialization failed:", err);
            process.exit(1);
          }
          EOF

      - name: Install Project Dependencies
        run: |
          npm init -y
          npm install dotenv node-fetch remotion @remotion/cli

      - name: Run Video Generation & Rendering Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node pipeline.mjs

      - name: Upload Final Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Final-Rendered-Video-Output
          path: output/
